name: ht_bot
description: HT BOT — Deriv Binary Options Trading Bot UI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Responsive sizing
  flutter_screenutil: ^5.9.0

  # Theme
  flex_color_scheme: ^8.0.2

  # Routing
  go_router: ^14.2.7

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Animations
  flutter_animate: ^4.5.0

  # Glassmorphism
  glassmorphism_ui: ^0.3.0
  blur: ^3.1.0

  # Charts
  fl_chart: ^0.68.0

  # Fonts
  google_fonts: ^6.2.1

  # Spacing
  gap: ^3.0.1

  # Formatting
  intl: ^0.19.0

  # SVG support
  flutter_svg: ^2.0.10+1

  # Icons
  lucide_icons_flutter: ^1.0.29

  # Lottie animations
  lottie: ^3.1.0

  # Grid layout
  flutter_staggered_grid_view: ^0.7.0

  # Secure storage (OAuth PKCE state persistence)
  flutter_secure_storage: ^9.2.2

  # URL launching (OAuth flow)
  url_launcher: ^6.3.0

  # Cryptographic hashing (PKCE code challenge)
  crypto: ^3.0.3

  # HTTP requests
  http: ^1.2.0

  # WebSocket
  web_socket_channel: ^3.0.1

  # Supabase (Backend integration)
  supabase_flutter: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  mockito: ^5.4.4
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
